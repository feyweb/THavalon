<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <title>Your role</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <div id="error" class="error"></div>

  <!-- Public, so it sits outside the cover: knowing who proposes first tells you nothing about
       anyone's role, and it is the thing people need while the cards stay face down. -->
  <p class="proposer hidden" id="proposer"></p>

  <!-- The card is fetched once and built up front, but stays behind this cover until asked for.
       Rendering it on arrival meant a role could be on screen while the phone was still being
       handed over. -->
  <div class="card cover-card" id="cover">
    <p class="cover-name" id="cover-name"></p>
    <p class="cover-hint">Make sure nobody can see your screen.</p>
    <button id="reveal-btn">Reveal my role</button>
  </div>

  <!-- Rendered once and then left alone: nothing repaints while you are taking a screenshot. -->
  <div class="card role-card hidden" id="card">
    <span class="team-badge" id="team"></span>
    <h1 class="role-name" id="role"></h1>
    <p class="player-name" id="name"></p>

    <p class="description" id="description"></p>

    <div class="info-block hidden" id="info-block">
      <h3>What you know</h3>
      <ul id="info"></ul>
    </div>

    <p class="assassin-note hidden" id="assassin">You are the Assassin</p>
  </div>

  <button id="hide-btn" class="secondary hidden">Hide my role</button>

  <div class="card hidden" id="roster-card">
    <h2><span id="player-count">0</span> players in this game</h2>
    <ol class="players" id="players"></ol>
  </div>

  <div class="footer-links">
    <a href="index.html">Leave this game</a>
  </div>
</main>

<script src="app.js"></script>
<script>
  const gameId = gameIdFromUrl();

  function show(id) { document.getElementById(id).classList.remove('hidden'); }
  function hide(id) { document.getElementById(id).classList.add('hidden'); }

  /** Face up. The card is already built, so this only changes what is visible. */
  function reveal() {
    hide('cover');
    show('card');
    show('hide-btn');
  }

  /** Face down again — for putting the phone on the table mid-game without closing the tab. */
  function conceal() {
    hide('card');
    hide('hide-btn');
    show('cover');
  }

  (async () => {
    if (!store.token(gameId)) {
      location.replace('index.html');
      return;
    }
    try {
      const me = await api(`/api/games/${gameId}/me`, { gameId });

      if (me.state === 'LOBBY') {
        goTo('lobby.html', gameId);
        return;
      }

      document.getElementById('cover-name').textContent = me.name;

      if (me.firstProposer) {
        document.getElementById('proposer').innerHTML =
          `<strong>${escapeHtml(me.firstProposer)}</strong> proposes the first mission`;
        show('proposer');
      }

      const card = document.getElementById('card');
      card.classList.add(me.team === 'EVIL' ? 'evil' : 'good');
      document.getElementById('team').textContent = me.team === 'EVIL' ? 'Evil' : 'Good';
      document.getElementById('role').textContent = me.role;
      document.getElementById('name').textContent = me.name;
      document.getElementById('description').textContent = me.description;

      if (me.info && me.info.length) {
        show('info-block');
        const list = document.getElementById('info');
        for (const line of me.info) {
          const li = document.createElement('li');
          li.textContent = line;
          list.append(li);
        }
      }

      if (me.assassin) {
        show('assassin');
      }

      if (me.players && me.players.length) {
        document.getElementById('player-count').textContent = me.players.length;
        const roster = document.getElementById('players');
        for (const name of me.players) {
          const li = document.createElement('li');
          li.append(document.createTextNode(name));
          // Mark which of these is you, matching how the lobby flags it.
          if (name === me.name) {
            const tag = document.createElement('span');
            tag.className = 'you-tag';
            tag.textContent = 'you';
            li.append(tag);
          }
          roster.append(li);
        }
        show('roster-card');
      }

      document.getElementById('reveal-btn').addEventListener('click', reveal);
      document.getElementById('hide-btn').addEventListener('click', conceal);
    } catch (e) {
      // A token this game does not recognise — most likely left over from an earlier game that
      // reused the same ID. Send them back to rejoin rather than showing a dead end.
      if (e.status === 401) {
        store.forget(gameId);
        sessionStorage.setItem('thavalon:notice', `You are not in ${gameId} any more. Join again to play.`);
        location.replace('index.html');
        return;
      }
      showError(e.message);
    }
  })();

  function escapeHtml(value) {
    const div = document.createElement('div');
    div.textContent = value ?? '';
    return div.innerHTML;
  }
</script>
</body>
</html>
